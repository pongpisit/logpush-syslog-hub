name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Worker types
        run: npx wrangler types

      - name: Build UI (also required by the Worker's assets binding for tests)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: npx vitest run --coverage

  smoke-test-syslog-script:
    name: Smoke-test setup-test-syslog.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell lint the script
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          # -S warning: fail on real problems, ignore cosmetic style/info nits
          # (which can vary between shellcheck versions on the runner).
          shellcheck -S warning scripts/setup-test-syslog.sh

      - name: Run the setup script (installs + configures rsyslog on TCP 1514)
        run: sudo env PORT=1514 bash scripts/setup-test-syslog.sh

      - name: Send a CEF line over TCP and assert it lands in the logfile
        run: |
          set -euo pipefail
          LOGFILE=/var/log/logpush-syslog-hub.log
          # A realistic RFC 3164 line whose "CEF:" tag would break a naive $msg filter.
          LINE='<134>Jul 13 03:20:05 cloudflare CEF:0|Cloudflare|Logpush|1.0|http_requests|HTTP Request|0|src=203.0.113.1 act=block'
          printf '%s\n' "$LINE" | nc -w3 127.0.0.1 1514

          # Poll for the line rather than a fixed sleep (rsyslog flush timing varies).
          for _ in $(seq 1 20); do
            if sudo grep -qF "$LINE" "$LOGFILE" 2>/dev/null; then break; fi
            sleep 0.5
          done

          echo "--- $LOGFILE ---"; sudo cat "$LOGFILE" 2>/dev/null || echo '(empty/missing)'; echo '---'

          if ! sudo grep -qF "$LINE" "$LOGFILE" 2>/dev/null; then
            echo '::error::CEF line was not captured in the logfile'
            echo '--- rsyslog status ---';        sudo systemctl status rsyslog --no-pager || true
            echo '--- ls -l logfile ---';         sudo ls -l "$LOGFILE" || true
            echo '--- rsyslog journal (tail) ---'; sudo journalctl -u rsyslog --no-pager | tail -30 || true
            exit 1
          fi
          echo '✓ CEF line captured intact (byte-for-byte $rawmsg passthrough)'

          # And it must NOT have leaked into the default syslog file (the `stop`).
          if sudo test -f /var/log/syslog && sudo grep -q 'CEF:0|Cloudflare' /var/log/syslog; then
            echo '::error::CEF line leaked into /var/log/syslog (stop directive not working)'; exit 1
          fi
          echo '✓ Did not leak into /var/log/syslog'
